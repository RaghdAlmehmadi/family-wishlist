[build]
  publish = "."
  command = "node scripts/build-config.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
